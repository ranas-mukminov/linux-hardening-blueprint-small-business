---
- name: Install logging packages
  ansible.builtin.package:
    name:
      - rsyslog
      - logrotate
    state: present

- name: Configure journald retention
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy journald drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-hardening.conf
    content: |
      [Journal]
      SystemMaxUse={{ logging_journal_max_use }}
      Compress=yes
      Storage=persistent
    owner: root
    group: root
    mode: "0644"
  notify: restart journald

- name: Configure rsyslog forwarding
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/99-hardening.conf
    content: |
      # Generated by linux-harden blueprint
      $ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
      {% if logging_remote_host %}*.* @@{{ logging_remote_host }}:514{% else %}# Remote host disabled{% endif %}
    owner: root
    group: root
    mode: "0644"
  notify: restart rsyslog

- name: Harden logrotate policy for auth logs
  ansible.builtin.template:
    src: logrotate-hardening.j2
    dest: /etc/logrotate.d/linux-harden
    owner: root
    group: root
    mode: "0644"

- name: Ensure rsyslog enabled
  ansible.builtin.service:
    name: rsyslog
    enabled: true
    state: started
