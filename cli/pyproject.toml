[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-harden"
version = "0.1.0"
description = "CLI wrapper for the Linux hardening blueprint"
authors = [{name = "Ranas Mukminov"}]
license = {text = "Apache-2.0"}
dependencies = [
  "typer[all]>=0.9",
  "pyyaml>=6.0",
]
requires-python = ">=3.10"

[project.scripts]
linux-harden = "linux_hardener.cli:run"

[tool.setuptools.packages.find]
where = ["."]
