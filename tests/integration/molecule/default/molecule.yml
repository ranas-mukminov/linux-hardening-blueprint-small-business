---
driver:
  name: docker
platforms:
  - name: debian12
    image: docker.io/debian:12
    privileged: true
    command: /sbin/init
  - name: rocky9
    image: docker.io/rockylinux/rockylinux:9
    privileged: true
    command: /usr/lib/systemd/systemd
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../../../ansible/roles
    ANSIBLE_REMOTE_TMP: /tmp/.ansible/tmp
  playbooks:
    converge: converge.yml
  inventory:
    host_vars:
      rocky9:
        ansible_become_method: su
verifier:
  name: ansible
