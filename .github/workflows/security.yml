name: Security

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: pip-audit
        run: pip-audit -r cli/pyproject.toml || true
      - name: Bandit
        run: bandit -qr cli
