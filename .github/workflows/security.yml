---
name: Security

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: Audit declared project dependencies
        # pip-audit accepts a PEP 621 project directory,
        # not a pyproject.toml as -r requirements.
        # Keep non-zero exit codes visible: a vulnerability
        # or scan failure must fail this job.
        run: pip-audit ./cli
      - name: Static analysis (Bandit)
        run: bandit -qr cli
