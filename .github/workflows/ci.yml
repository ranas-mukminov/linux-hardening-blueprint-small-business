name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - name: debian12
            limit: debian12
          - name: rocky9
            limit: rocky9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./cli ansible ansible-lint yamllint ruff black bandit pytest pytest-mock molecule[docker] pip-audit
          ansible-galaxy collection install community.general
      - name: Lint
        run: scripts/lint.sh
      - name: Unit tests
        run: pytest
      - name: Molecule
        run: molecule test -- --limit "${{ matrix.platform.limit }}"
        working-directory: tests/integration/molecule/default
